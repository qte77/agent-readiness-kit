---
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: "security-updates"
        patterns: ["*"]
    ignore:
      # @types/node tracks the Node runtime major. The repo runs Node 24 (package.json engines,
      # setup-node 24 in CI), so a types major ahead of it would type-check APIs the runtime lacks.
      # Bump the types major by hand together with engines and CI when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      worker-npm-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      worker-npm-security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
