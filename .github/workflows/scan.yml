---
name: scan

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan:
    name: scan properties
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout polyfetch-scrape
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qte77/polyfetch-scrape
          path: polyfetch-scrape

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLYFETCH_SCRAPE_DIR: ${{ github.workspace }}/polyfetch-scrape
        run: npm run scan

      - name: Commit scan results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # Commit through the Git Data API with no custom author, so GitHub signs it: the
        # required_signatures ruleset blocks a squash-merge whose head commit is unsigned
        # (a local `git commit` here left PR #94 blocked as "unsigned").
        run: |
          set -euo pipefail
          git add data/scans/
          if git diff --cached --quiet; then
            echo "No scan changes to commit."
            exit 0
          fi

          base_sha=$(git rev-parse HEAD)
          base_tree=$(gh api "repos/$REPO/git/commits/$base_sha" --jq '.tree.sha')

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          entries="$tmp/entries.jsonl"
          : > "$entries"
          while IFS=$'\t' read -r status path; do
            if [[ "$status" == "D" ]]; then
              jq -nc --arg p "$path" '{path: $p, mode: "100644", type: "blob", sha: null}' >> "$entries"
            else
              base64 -w0 "$path" | jq -Rs '{content: ., encoding: "base64"}' > "$tmp/blob.json"
              sha=$(gh api "repos/$REPO/git/blobs" --input "$tmp/blob.json" --jq '.sha')
              jq -nc --arg p "$path" --arg s "$sha" '{path: $p, mode: "100644", type: "blob", sha: $s}' >> "$entries"
            fi
          done < <(git diff --cached --name-status --no-renames -- data/scans/)

          jq -s --arg b "$base_tree" '{base_tree: $b, tree: .}' "$entries" > "$tmp/tree.json"
          tree=$(gh api "repos/$REPO/git/trees" --input "$tmp/tree.json" --jq '.sha')

          jq -n --arg m "chore(scan): update scan results" --arg t "$tree" --arg p "$base_sha" \
            '{message: $m, tree: $t, parents: [$p]}' > "$tmp/commit.json"
          commit=$(gh api "repos/$REPO/git/commits" --input "$tmp/commit.json" --jq '.sha')

          branch="chore/scan-results-$(date -u +%Y%m%d%H%M%S)"
          gh api "repos/$REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$commit" --jq '.ref' > /dev/null

          gh pr create --title "chore(scan): update scan results" \
            --body "Automated scan results update." \
            --base main --head "$branch"
          # Required status check (CodeFactor) hasn't reported yet seconds after PR
          # creation, so an immediate merge is rejected; --auto waits for it instead.
          gh pr merge "$branch" --squash --auto --delete-branch
