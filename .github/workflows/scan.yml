---
name: scan

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan:
    name: scan properties
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout polyfetch-scrape
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qte77/polyfetch-scrape
          path: polyfetch-scrape

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLYFETCH_SCRAPE_DIR: ${{ github.workspace }}/polyfetch-scrape
        run: npm run scan

      - name: Commit scan results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scans/
          if git diff --cached --quiet; then
            echo "No scan changes to commit."
            exit 0
          fi
          branch="chore/scan-results-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git commit -m "chore(scan): update scan results"
          git push origin "$branch"
          gh pr create --title "chore(scan): update scan results" \
            --body "Automated scan results update." \
            --base main --head "$branch"
          gh pr merge "$branch" --squash --auto --delete-branch
